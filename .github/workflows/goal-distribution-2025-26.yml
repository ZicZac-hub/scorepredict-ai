name: Independent 2025-26 score distribution replay
on:
  pull_request:
    paths:
      - 'run_goal_distribution_2025_26_audit.py'
      - 'tests/test_goal_distribution_2025_26_audit.py'
      - '.github/workflows/goal-distribution-2025-26.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python run_goal_distribution_2025_26_audit.py > later-season-results.json
      - name: Print provenance and comparison
        run: cat later-season-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: later-season-results
          path: later-season-results.json
