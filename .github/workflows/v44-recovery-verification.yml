name: V44 isolated recovery verification
on:
  pull_request:
    paths:
      - 'v44_recovery_evidence_audit.py'
      - 'v44_collection_health.py'
      - 'tests/test_v44_collection_health.py'
      - 'tests/test_v44_recovery_evidence_audit.py'
      - '.github/workflows/v44-recovery-verification.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_recovery_capture.py tests/test_v44_recovery_evidence_audit.py tests/test_v44_collection_health.py
      - name: Inspect published collection health without inferring job status
        run: |
          python v44_collection_health.py > /tmp/v44-collection-health.json
          cat /tmp/v44-collection-health.json
      - name: Reproduce archived recovery forecasts and verify results
        env:
          OPENAI_API_KEY: ""
          API_FOOTBALL_KEY: ""
          SPORTMONKS_API_KEY: ""
        run: |
          python v44_recovery_evidence_audit.py > /tmp/v44-recovery-verification.json
          python -c 'import json; r=json.load(open("/tmp/v44-recovery-verification.json")); print(json.dumps({k:v for k,v in r.items() if k!="rows"},indent=2)); raise SystemExit(bool(r["rejections"]))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-recovery-verification
          path: |
            /tmp/v44-recovery-verification.json
            /tmp/v44-collection-health.json
          if-no-files-found: warn
          retention-days: 14
