name: V44 joint-score pair transfer research
on:
  pull_request:
    paths:
      - 'v44_joint_pair_transfer.py'
      - 'tests/test_v44_joint_pair_transfer.py'
      - '.github/workflows/v44-joint-pair-transfer.yml'
  push:
    branches: [main]
    paths:
      - 'v44_joint_pair_transfer.py'
      - 'tests/test_v44_joint_pair_transfer.py'
      - '.github/workflows/v44-joint-pair-transfer.yml'
  schedule:
    # Read only saved evidence; no new provider requests or archive writes.
    - cron: '41 */6 * * *'
  workflow_dispatch:
concurrency:
  group: v44-joint-pair-transfer-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ""
      SPORTMONKS_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_joint_pair_transfer.py tests/test_v44_v9_pair_replay.py tests/test_v44_joint_rate_tilt.py
      - run: |
          python v44_joint_pair_transfer.py > /tmp/joint-pair-transfer.json
          python -c 'import json; r=json.load(open("/tmp/joint-pair-transfer.json")); print(json.dumps({k:v for k,v in r.items() if k!="rows"},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: joint-pair-transfer
          path: /tmp/joint-pair-transfer.json
          retention-days: 30
