name: Verify prospective prediction results
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'
permissions:
  contents: write
concurrency:
  group: prospective-result-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate strictly matched, existing verified provider evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python evaluate_prospective_ledger.py
      - name: Commit verification ledger and comparison if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospective_ledger
          if git diff --cached --quiet; then
            echo "No new verified settlement or comparison"
            exit 0
          fi
          git commit -m "chore: refresh verified prospective settlement evidence"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "::error::Concurrent ledger conflict requires independent review"
              exit 1
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Unstaged settlement conflict requires review"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Verified settlement published"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Could not publish settlement after four attempts"
          exit 1
