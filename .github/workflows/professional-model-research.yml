name: Reproduce professional football model research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: python -m pip install -r research-requirements.txt 'pytest>=8,<10'
      - name: Verify date safety, sources and whole-set scoring
        run: python -m pytest -q tests/test_target70_data.py tests/test_target70_benchmark.py tests/test_target70_postholdout_audit.py tests/test_source_quality_audit.py tests/test_model_comparison_research.py tests/test_professional_double_optimizer.py tests/test_professional_double_shadow.py tests/test_professional_paired_study.py tests/test_v21_matched_refresh.py
      - name: Reproduce pinned-source research without touching forecasts
        run: python run_professional_research.py --include-gradient-boost
      - name: Preserve full research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-football-model-research
          path: work/professional_research/
          if-no-files-found: warn
