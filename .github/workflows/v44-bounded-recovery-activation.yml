name: V44 bounded recovery activation
on:
  pull_request:
    paths:
      - '.github/workflows/prematch-evidence.yml'
      - 'v44_recovery_queue.py'
      - 'tests/test_v44_recovery_queue.py'
      - '.github/workflows/v44-bounded-recovery-activation.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/prematch-evidence.yml'
      - 'v44_recovery_queue.py'
      - 'tests/test_v44_recovery_queue.py'
      - '.github/workflows/v44-bounded-recovery-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ""
      SPORTMONKS_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_recovery_queue.py tests/test_v44_recovery_capture.py tests/test_v44_cache_only_recovery.py tests/test_v44_refresh_priority.py tests/test_v44_recovery_source_freshness.py
      - name: Inspect upcoming history readiness without provider requests
        run: |
          python v44_refresh_expiry_audit.py > /tmp/refresh-expiry.json
          python -c 'import json; r=json.load(open("/tmp/refresh-expiry.json")); print(json.dumps({k:v for k,v in r.items() if k!="rows"},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-recovery-readiness
          path: /tmp/refresh-expiry.json
          retention-days: 14
