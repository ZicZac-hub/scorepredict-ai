name: V42 isolated research watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: v42-research-only
  cancel-in-progress: false
jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      V42_AI_RESEARCH_ENABLED: ${{ vars.V42_AI_RESEARCH_ENABLED }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_v42_research.py
      - run: python v42_research_bot.py
      - name: Publish only isolated research archive
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path("data/v42_research")
          volatile={"checked_at_utc","evaluated_at_utc","started_at_utc","completed_at_utc"}
          for p in root.glob("*.json"):
              if p.name not in {"status.json","performance.json","watchdog.json"}:
                  continue
              old=subprocess.run(["git","show","HEAD:"+str(p)],capture_output=True,text=True)
              if old.returncode==0:
                  a,b=json.loads(old.stdout),json.loads(p.read_text())
                  if {k:v for k,v in a.items() if k not in volatile}=={k:v for k,v in b.items() if k not in volatile}:
                      p.write_text(old.stdout)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v42_research/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: isolated V42 research refresh [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v42-research-reports
          path: data/v42_research/
          if-no-files-found: warn
          retention-days: 14
