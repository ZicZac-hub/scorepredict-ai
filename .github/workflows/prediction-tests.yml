name: Prediction integrity tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3' 'pytest>=8,<10'
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Compile application modules
        run: python -m compileall -q -x '/\\.git/' .
