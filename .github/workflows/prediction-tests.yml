name: Prediction integrity tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forecast_test
          POSTGRES_PASSWORD: forecast_test
          POSTGRES_DB: forecast_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forecast_test -d forecast_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forecast_test:forecast_test@localhost:5432/forecast_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Independently reproduce archived V8 versus V25 matched study
        run: |
          python v8_v25_matched_audit.py --output /tmp/v8_v25_matched.json
          python -c 'import json; r=json.load(open("/tmp/v8_v25_matched.json")); assert r["source_valid_sets"] > 0, "No original frozen pairs passed independent provenance checks"; print("V8/V25 matched archive:", r["verified_matched_pairs"], "verified,", r["pending_matched_pairs"], "pending; v8 hits:", r["v8"]["five_double_hits"], "v25 hits:", r["v25"]["five_double_hits"])'
      - name: Audit prospective V25 probability freeze coverage
        run: |
          python v25_prospective_monitor.py --audit /tmp/v8_v25_matched.json --output /tmp/v25_freeze_monitor.json --require-provenance
          python -c 'import json; d=json.load(open("/tmp/v25_freeze_monitor.json")); assert d["check_passed"]; print("Prospective V25 frozen:", d["new_sets_with_both_valid_grids_and_mixture"], "verified:", d["new_verified_pairs"], "pending:", d["new_pending_pairs"])'
      - name: Independently reproduce V25 70-percent model feasibility
        run: |
          python v25_five_double_frontier.py --output /tmp/v25_five_double_frontier.json
          python -c 'import json; x=json.load(open("/tmp/v25_five_double_frontier.json")); assert x["original_archived_sets"] > 0; assert not x["real_70pct_five_double_hit_rate_proven"]; print("70pct model feasibility:", x["sets_with_70pct_model_mass_in_only_five"], "of", x["original_archived_sets"])'
      - name: Validate V26 historical chronology and prospective no-hindsight integrity
        run: |
          python v26_temporal_score.py --verify-only
          python -c 'import json; r=json.load(open("data/v26_temporal_calibration/status.json")); assert r["original_frozen_forecasts_changed"] is False; assert r["production_model_promoted"] is False; print("V26 replay holdout:", r["chronological_research_replay"]["verified_holdout_fixtures"], "frozen verified:", r["prospective_verified"]["verified_pairs"])'
      - name: Audit original-slate V27 decisions without creating new selections
        run: |
          python v27_pair_selection.py --verify-only
          python -c 'import json; x=json.load(open("data/v27_pair_selection/status.json")); assert not x["production_model_promoted"]; assert x["original_frozen_predictions_modified"] is False; assert x["prospective_comparison"]["no_lookahead_or_retrospective_selection"]; print("V27 frozen decisions:", x["prospective_comparison"]["frozen_decision_days"], "verified same-day comparisons:", x["prospective_comparison"]["both_policies_verified_same_days"])'
      - name: Regrade V28 write-once prospective pair trial read-only
        run: |
          python v28_independent_pair_trial.py --verify-only
          python -c 'import json; r=json.load(open("data/v28_independent_pair_trial/status.json")); assert not r["forecast_production_model_modified"]; assert r["original_v8_v25_v26_v27_forecasts_changed"] is False; print("V28 verified matched policy days:",r["verified_comparison"]["verified_paired_days"], "new future-only decisions:",r["verified_comparison"]["original_frozen_decisions"])'
      - name: Independently validate new V29 pair-sensitivity and V28 readiness
        run: |
          python v29_pair_sensitivity.py --verify-only
          python -c 'import json; r=json.load(open("data/v29_pair_sensitivity/status.json")); s=r["research"]; assert s["no_source_or_forecast_changes"]; assert s["live_predictions_unchanged"]; assert s["seventy_percent_not_proven"]; assert not s["v28_capture_and_result_readiness"]["invalid_original_v28_days_excluded"]; print("V28 real frozen days:", s["v28_capture_and_result_readiness"]["v28_frozen_active_days"], "identical quality/control:", s["v28_capture_and_result_readiness"]["v28_identical_policy_pair_days"], "V29 verified alternate days:", s["v29_distinct_pair_experiment"]["both_arms_verified_days"])'
      - name: Independently audit every prospective V28 candidate pair and ranking cohort
        run: |
          python v30_full_slate_audit.py
          python -c 'import json; x=json.load(open("data/v30_full_slate_ranking/status.json")); assert x["no_new_predictions_or_past_score_reconstruction"]; assert x["overlapping_pairs_are_not_independent_samples"]; assert x["no_production_model_promotion"]; assert x["seventy_percent_five_double_hit_rate_not_proven"]; assert not x["invalid_or_tampered_frozen_days_excluded"]; print("V30 frozen candidate pairs:",x["frozen_candidate_pair_rows"], "verified pair rows:",x["candidate_pair_rows_independently_verified"], "fully verified Sydney slates:",x["fully_verified_slate_days"])'
      - name: Compile application modules
        run: python -m compileall -q -x '/\\.git/' .
