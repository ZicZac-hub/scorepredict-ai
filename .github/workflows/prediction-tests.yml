name: Prediction integrity tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forecast_test
          POSTGRES_PASSWORD: forecast_test
          POSTGRES_DB: forecast_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forecast_test -d forecast_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://forecast_test:forecast_test@localhost:5432/forecast_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3' 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Run all regression tests
        run: python -m pytest -q
      - name: Compile application modules
        run: python -m compileall -q -x '/\\.git/' .
