name: Diagnose prediction data coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python diagnose_collection_health.py
      - name: Commit sanitized diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/collection_health.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh prediction data coverage diagnostics"
          git push
