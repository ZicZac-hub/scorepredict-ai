name: ZicZac model checks and historical backtest

on:
  push:
    paths:
      - 'engine.py'
      - 'backtest.py'
      - 'test_engine_recency.py'
      - '.github/workflows/model-backtest.yml'
      - 'data/backtest_finished_matches.json'
  workflow_dispatch:

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Run model regression tests
        run: python -m unittest -v test_engine_recency.py
      - name: Validate backtest module
        run: python -m py_compile engine.py backtest.py
      - name: Backtest verified historical fixtures when available
        shell: bash
        run: |
          if [ -s data/backtest_finished_matches.json ]; then
            python backtest.py data/backtest_finished_matches.json --output backtest_results.json
          else
            echo 'No historical fixture JSON in data/backtest_finished_matches.json.'
            echo 'Skipping historical accuracy claims; regression tests still run.'
            printf '{"status":"awaiting_verified_historical_dataset"}\n' > backtest_results.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ziczac-backtest-results
          path: backtest_results.json
