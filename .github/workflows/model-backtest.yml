# Backtest rerun requested after successful workflow #13.
name: ZicZac model checks and historical backtest

on:
  push:
    paths:
      - 'engine.py'
      - 'forecast_model.py'
      - 'reference_model.py'
      - 'reference_provider_benchmark.py'
      - 'backtest.py'
      - 'calibration_backtest.py'
      - 'xg_holdout.py'
      - 'score_diversity_audit.py'
      - 'hybrid_calibration.py'
      - 'home_away_calibration.py'
      - 'league_calibration.py'
      - 'exact_score_audit.py'
      - 'challenger_audit.py'
      - 'league_opponent_model.py'
      - 'ensemble_ranking.py'
      - 'double_score_backtest.py'
      - 'balanced_double_backtest.py'
      - 'double_score_selection.py'
      - 'test_double_score_selection.py'
      - 'fetch_backtest_history.py'
      - 'test_engine_recency.py'
      - '.github/workflows/model-backtest.yml'
      - 'data/backtest_finished_matches.json'
  workflow_dispatch:

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Run model regression tests
        run: python -m unittest -v test_engine_recency.py test_double_score_selection.py
      - name: Validate backtest module
        run: python -m py_compile engine.py backtest.py calibration_backtest.py xg_holdout.py score_diversity_audit.py hybrid_calibration.py home_away_calibration.py league_calibration.py exact_score_audit.py challenger_audit.py league_opponent_model.py ensemble_ranking.py double_score_backtest.py balanced_double_backtest.py double_score_selection.py fetch_backtest_history.py
      - name: Fetch verified multi-season results using API-Football Pro
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python fetch_backtest_history.py \
            --leagues PL,PD,BL1,SA,FL1 \
            --seasons 2025,2026 \
            --max-matches 3500 \
            --output data/backtest_finished_matches.json
      - name: Run historical backtest
        run: |
          python backtest.py data/backtest_finished_matches.json --output backtest_results.json
      - name: Evaluate frozen reference-model candidate against preserved baseline
        run: python reference_provider_benchmark.py data/backtest_finished_matches.json --output reference_model_provider_results.json
      - name: Calibrate score probabilities and evaluate untouched 2026 holdout
        run: python calibration_backtest.py data/backtest_finished_matches.json --cutoff-year 2026 --output calibration_results.json
      - name: Evaluate alternative expected-goals model on 2026 holdout
        run: python xg_holdout.py data/backtest_finished_matches.json --output xg_holdout_results.json
      - name: Audit 1-1 prediction concentration on 2026 holdout
        run: python score_diversity_audit.py data/backtest_finished_matches.json --output score_diversity_results.json
      - name: Calibrate hybrid on 2025 and evaluate on untouched 2026
        run: python hybrid_calibration.py data/backtest_finished_matches.json --output hybrid_calibration_results.json
      - name: Calibrate home and away expected goals on 2025, test on 2026
        run: python home_away_calibration.py data/backtest_finished_matches.json --output home_away_calibration_results.json
      - name: Evaluate league-specific calibration with frozen 2025 coefficients
        run: python league_calibration.py data/backtest_finished_matches.json --output league_calibration_results.json
      - name: Audit exact scores and test calibrated low-score correction on 2026 holdout
        run: python exact_score_audit.py data/backtest_finished_matches.json --output exact_score_audit_results.json
      - name: Select challenger on 2025 and audit paired exact-score wins on 2026
        run: python challenger_audit.py data/backtest_finished_matches.json --output challenger_audit_results.json
      - name: Evaluate frozen probability ensemble on 2026 holdout
        run: python ensemble_ranking.py data/backtest_finished_matches.json --output ensemble_ranking_results.json
      - name: Backtest five exact-score doubles with chronological paired evaluation
        run: python double_score_backtest.py data/backtest_finished_matches.json --output double_score_backtest_results.json
      - name: Calibrate balanced five-double selection on 2025 and test on 2026
        run: python balanced_double_backtest.py data/backtest_finished_matches.json --output balanced_double_backtest_results.json
      - name: Print model comparison
        run: python -c "import json; r=json.load(open('backtest_results.json')); print(json.dumps({'summary':r['summary'],'by_league_year':r['by_league_year']},indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: ziczac-backtest-results
          path: |
            backtest_results.json
            reference_model_provider_results.json
            calibration_results.json
            xg_holdout_results.json
            score_diversity_results.json
            hybrid_calibration_results.json
            home_away_calibration_results.json
            league_calibration_results.json
            exact_score_audit_results.json
            challenger_audit_results.json
            ensemble_ranking_results.json
            double_score_backtest_results.json
            balanced_double_backtest_results.json
            data/backtest_finished_matches.json

