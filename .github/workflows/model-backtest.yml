# Backtest rerun requested after successful workflow #13.
name: ZicZac model checks and historical backtest

on:
  push:
    paths:
      - 'engine.py'
      - 'backtest.py'
      - 'calibration_backtest.py'
      - 'xg_holdout.py'
      - 'score_diversity_audit.py'
      - 'fetch_backtest_history.py'
      - 'test_engine_recency.py'
      - '.github/workflows/model-backtest.yml'
      - 'data/backtest_finished_matches.json'
  workflow_dispatch:

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Run model regression tests
        run: python -m unittest -v test_engine_recency.py
      - name: Validate backtest module
        run: python -m py_compile engine.py backtest.py calibration_backtest.py xg_holdout.py score_diversity_audit.py fetch_backtest_history.py
      - name: Fetch verified multi-season results using API-Football Pro
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python fetch_backtest_history.py \
            --leagues PL,PD,BL1,SA,FL1 \
            --seasons 2025,2026 \
            --max-matches 3500 \
            --output data/backtest_finished_matches.json
      - name: Run historical backtest
        run: |
          python backtest.py data/backtest_finished_matches.json --output backtest_results.json
      - name: Calibrate score probabilities and evaluate untouched 2026 holdout
        run: python calibration_backtest.py data/backtest_finished_matches.json --cutoff-year 2026 --output calibration_results.json
      - name: Evaluate alternative expected-goals model on 2026 holdout
        run: python xg_holdout.py data/backtest_finished_matches.json --output xg_holdout_results.json
      - name: Audit 1-1 prediction concentration on 2026 holdout
        run: python score_diversity_audit.py data/backtest_finished_matches.json --output score_diversity_results.json
      - name: Print model comparison
        run: python -c "import json; r=json.load(open('backtest_results.json')); print(json.dumps({'summary':r['summary'],'by_league_year':r['by_league_year']},indent=2))"
      - uses: actions/upload-artifact@v4
        with:
          name: ziczac-backtest-results
          path: |
            backtest_results.json
            calibration_results.json
            xg_holdout_results.json
            score_diversity_results.json
            data/backtest_finished_matches.json
