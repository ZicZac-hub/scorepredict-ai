name: Check ZicZac live Streamlit hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'daily_pick_ui.py'
      - 'v10_status_ui.py'
      - 'v10_evaluate.py'
      - 'v10_prospective.py'
      - 'market_score_v9.py'
      - 'multi_market_v10.py'
      - '.github/workflows/streamlit-live-smoke.yml'
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: read

jobs:
  check-host:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe live hosting; classify browser-only authentication
        shell: bash
        run: |
          python - <<'PY'
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from urllib.parse import urljoin,urlsplit
          import os,sys

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None

          opener=build_opener(NoRedirect())
          base="https://ziczacscorepredict-ai.streamlit.app"
          endpoints=("/_stcore/health","/?view=predict")
          records=[]
          for endpoint in endpoints:
              url=base+endpoint
              try:
                  with opener.open(Request(url,headers={
                      "User-Agent":"Mozilla/5.0 (compatible; ZicZac-Health-Check/1.0)"
                  }),timeout=25) as resp:
                      code=resp.status
                      location=resp.headers.get("Location")
              except HTTPError as exc:
                  code=exc.code
                  location=exc.headers.get("Location")
              except (URLError,TimeoutError,OSError) as exc:
                  code=0
                  location=None
              safe=urlsplit(urljoin(url,location)) if location else None
              # Never print sensitive redirect queries or authentication tokens.
              kind="browser_auth_redirect" if (
                  safe and (
                      safe.hostname=="share.streamlit.io"
                      or safe.path.startswith("/-/")
                  )) else "redirect" if 300<=code<400 else (
                      "reachable" if code==200 else "unreachable")
              print(f"{endpoint}: HTTP {code} / {kind}")
              records.append((code,kind))
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          if all(code==200 for code,kind in records):
              with open(summary,"a") as f:
                  f.write("✅ Streamlit returned HTTP 200 for both checks. This does not prove Python widget execution or deployment of the latest GitHub commit.\n")
              sys.exit(0)
          if all(code in (200,301,302,303,307,308) for code,kind in records):
              with open(summary,"a") as f:
                  f.write("⚠️ Streamlit uses a browser-only redirect/session flow. Automated HTTP checks are inconclusive, **not evidence that the website is down**. Open the site in Safari/Chrome or inspect the Streamlit Cloud runtime logs.\n")
              print("::warning::Streamlit authentication redirects may loop for non-browser checkers; verify in a real browser.")
              sys.exit(0)
          with open(summary,"a") as f:
              f.write("❌ Hosting returned a network/server error. Review Streamlit Cloud app logs and deployment ownership.\n")
          sys.exit(1)
          PY
