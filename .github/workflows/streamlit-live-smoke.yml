name: Check ZicZac live Streamlit hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'daily_pick_ui.py'
      - 'v10_status_ui.py'
      - 'v10_evaluate.py'
      - 'v10_prospective.py'
      - 'market_score_v9.py'
      - 'multi_market_v10.py'
      - '.github/workflows/streamlit-live-smoke.yml'
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: read

jobs:
  check-host:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check URL and Streamlit server health
        shell: bash
        run: |
          set -uo pipefail
          site="https://ziczacscorepredict-ai.streamlit.app"
          for attempt in 1 2 3; do
            health=$(curl -L -sS -m 35 -o /tmp/ziczac-health -w '%{http_code}' "$site/_stcore/health" || true)
            page=$(curl -L -sS -m 35 -o /tmp/ziczac-page -w '%{http_code}' "$site/?view=predict" || true)
            echo "Attempt $attempt: Streamlit health HTTP $health; Daily Prediction page HTTP $page"
            if [[ "$health" == "200" && "$page" == "200" ]]; then
              echo "Live hosting responds to requests." >> "$GITHUB_STEP_SUMMARY"
              echo "GitHub source commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
              echo "NOTE: HTTP availability alone does not prove the app uses the latest commit or that every Python widget works." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "HTTP checks did not pass. Examining the first three redirects WITHOUT printing signed parameters." >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=build_opener(NoRedirect())
          url="https://ziczacscorepredict-ai.streamlit.app/_stcore/health"
          for attempt in range(3):
              try:
                  result=opener.open(Request(url,method="GET"),timeout=12)
                  status=result.status
                  location=result.headers.get("Location")
              except HTTPError as exc:
                  status=exc.code
                  location=exc.headers.get("Location")
              except URLError as exc:
                  print("Network error:",type(exc.reason).__name__)
                  break
              target=urljoin(url,location) if location else ""
              parsed=urlsplit(target)
              # Never print query strings, cookies, tokens, or signed URLs.
              safe_path="/"+(parsed.path.strip("/").split("/")[0] if parsed.path.strip("/") else "")
              print(f"Redirect diagnostic {attempt+1}: HTTP {status}, destination host={parsed.hostname or '-'}, path-prefix={safe_path}")
              if status not in (301,302,303,307,308) or not location: break
              url=target
          PY
          echo "The application may be private/auth-gated, incorrectly redirected, or not deployed. HTTP checks alone cannot prove the Python app is functioning." >> "$GITHUB_STEP_SUMMARY"
          exit 1
