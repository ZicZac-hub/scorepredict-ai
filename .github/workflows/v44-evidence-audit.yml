name: V44 read-only evidence audit
on:
  pull_request:
    paths:
      - 'v44_*.py'
      - 'tests/test_v44_*.py'
      - '.github/workflows/v44-evidence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_family_pool_research.py tests/test_v44_authenticated_replay.py tests/test_v44_fixture_evidence.py tests/test_v44_single_calibration.py
      - name: Read authenticated archived evidence
        run: |
          python v44_fixture_evidence.py > /tmp/v44-fixture.json
          python v44_authenticated_replay.py > /tmp/v44-pairs.json
          python v44_single_calibration.py > /tmp/v44-single.json
          python -c 'import json; print(json.dumps({name: {k:v for k,v in json.load(open("/tmp/v44-"+name+".json")).items() if k!="rows"} for name in ("fixture","pairs","single")},indent=2))'
