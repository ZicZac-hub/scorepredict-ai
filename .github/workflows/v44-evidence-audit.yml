name: V44 read-only evidence audit
on:
  pull_request:
    paths:
      - 'v44_*.py'
      - 'v21_capture_sources_v2.py'
      - 'capture_prematch.py'
      - '.github/workflows/prematch-evidence.yml'
      - '.github/workflows/v42-research-watchdog.yml'
      - 'tests/test_early_source_checkpoint.py'
      - 'tests/test_v44_*.py'
      - '.github/workflows/v44-evidence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_family_pool_research.py tests/test_v44_authenticated_replay.py tests/test_v44_fixture_evidence.py tests/test_v44_single_calibration.py tests/test_v44_late_evidence_audit.py tests/test_v44_xg_age_research.py tests/test_v44_venue_sampling_research.py tests/test_v44_venue_collector.py tests/test_v44_scheduled_collection.py tests/test_v44_pair_transfer_research.py tests/test_v44_shared_tempo_research.py tests/test_v44_score_driven_research.py tests/test_v44_early_history.py tests/test_v44_ratings_prospective.py tests/test_v44_watchdog_integration.py tests/test_v44_rest_context_research.py tests/test_v44_opportunity_audit.py tests/test_v44_market_ablation.py tests/test_v44_market_pool_calibration.py tests/test_v44_v9_reliability.py tests/test_v44_v9_pair_replay.py tests/test_v44_live_evidence_diagnostics.py tests/test_v44_fresh_history_study.py tests/test_early_source_checkpoint.py
      - name: Read authenticated archived evidence
        run: |
          python v44_fixture_evidence.py > /tmp/v44-fixture.json
          python v44_authenticated_replay.py > /tmp/v44-pairs.json
          python v44_single_calibration.py > /tmp/v44-single.json
          python v44_late_evidence_audit.py > /tmp/v44-late.json
          python v44_xg_age_research.py > /tmp/v44-xg.json
          python v44_venue_sampling_research.py > /tmp/v44-venue.json
          python v44_venue_collector.py > /tmp/v44-collector.json
          python v44_pair_transfer_research.py > /tmp/v44-transfer.json
          python v44_shared_tempo_research.py > /tmp/v44-tempo.json
          python v44_score_driven_research.py > /tmp/v44-ratings.json
          python v44_early_history_audit.py > /tmp/v44-early.json
          python v44_ratings_prospective.py > /tmp/v44-prospective.json
          python v44_rest_context_research.py > /tmp/v44-rest.json
          python v44_opportunity_audit.py > /tmp/v44-opportunities.json
          python v44_market_ablation.py > /tmp/v44-market.json
          python v44_market_pool_calibration.py > /tmp/v44-marketpool.json
          python v44_v9_reliability.py > /tmp/v44-v9reliability.json
          python v44_v9_pair_replay.py > /tmp/v44-v9pairs.json
          python v44_live_evidence_diagnostics.py > /tmp/v44-livediagnostics.json
          python v44_fresh_history_study.py > /tmp/v44-freshhistory.json
          python -c 'import json; print(json.dumps({name: {k:v for k,v in json.load(open("/tmp/v44-"+name+".json")).items() if k!="rows"} for name in ("fixture","pairs","single","late","xg","venue","collector","transfer","tempo","ratings","early","prospective","rest","opportunities","market","marketpool","v9reliability","v9pairs","livediagnostics","freshhistory")},indent=2))'
