name: V21 historical research benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - v21_historical_benchmark.py
      - .github/workflows/v21-historical-benchmark.yml

permissions:
  contents: read
  actions: read

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing statistical model dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve preserved pre-upgrade 2,255-match V14 source archive
        uses: actions/download-artifact@v4
        with:
          name: v14-five-double-robust-historical-validation
          run-id: 43685699587
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/v21_historical_input
      - name: Compare V8 and V21 high-score challengers on identical history
        run: |
          python v21_historical_benchmark.py \
            --input /tmp/v21_historical_input/v14_verified_matches.json \
            --output /tmp/v21_reports/historical_validation.json \
            --max-eval 500
      - name: Save full auditable retrospective performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v21-retrospective-challenge
          path: /tmp/v21_reports/historical_validation.json
          if-no-files-found: warn
          retention-days: 90
