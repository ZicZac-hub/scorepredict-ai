name: V44 joint score dependence calibration
on:
  pull_request:
    paths:
      - 'v44_joint_rate_tilt.py'
      - 'tests/test_v44_joint_rate_tilt.py'
      - '.github/workflows/v44-joint-rate-tilt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_joint_rate_tilt.py tests/test_v44_bayesian_rate_calibration.py
      - run: |
          python v44_joint_rate_tilt.py > /tmp/joint-rate-tilt.json
          python -c 'import json; r=json.load(open("/tmp/joint-rate-tilt.json")); print(json.dumps({k:v for k,v in r.items() if k!="rows"},indent=2))'
      - uses: actions/upload-artifact@v4
        with:
          name: joint-rate-tilt
          path: /tmp/joint-rate-tilt.json
          retention-days: 14
