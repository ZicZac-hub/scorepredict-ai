name: Dynamic Dixon-Coles component ablation
on:
  pull_request:
    paths:
      - 'run_dynamic_dc_ablation.py'
      - '.github/workflows/dc-ablation.yml'
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python run_dynamic_dc_ablation.py | tee dc-ablation.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: dc-ablation
          path: dc-ablation.json
