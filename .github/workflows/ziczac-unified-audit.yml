name: Publish ZicZac Verified Prediction Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ziczac_unified_audit.py'
      - 'ziczac_unified_audit_ui.py'
      - 'ziczac_interactive_capture.py'
      - '.github/workflows/ziczac-unified-audit.yml'

permissions:
  contents: write

# Reuse the existing immutable forecast publish lock. Never rewrite data
# against another collector without first pulling its newest records.
concurrency:
  group: ziczac-prematch-persistence
  cancel-in-progress: false

jobs:
  audit:
    # Manual dispatch from a feature branch must never push its source into main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only forecast analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Build public audit without calling any sports or LLM API
        run: python ziczac_unified_audit.py
      - name: Commit frozen public status only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracking/status.json
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "data: publish independently verified prediction status [skip ci]"
          original_head=$(git rev-parse HEAD^)
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$original_head" origin/main -- data/tracking/status.json; then
              echo "A newer tracking report was already published. Do not overwrite it."
              exit 0
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo "Published scheduled-frozen, public evidence audit."
              exit 0
            fi
            sleep 3
          done
          echo "Could not safely publish the audit after retries"
          exit 1
