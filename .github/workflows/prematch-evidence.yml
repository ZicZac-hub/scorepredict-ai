name: Capture verified pre-match evidence

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forecast_model.py'
      - 'reference_model.py'
      - 'rescore_predictions.py'
      - 'revision_store.py'
      - 'revision_jobs.py'
      - 'double_revisions.py'
      - 'smart_double_ai.py'
      - 'update_saved_forecasts.py'
      - '.github/workflows/prematch-evidence.yml'

permissions:
  contents: write

concurrency:
  group: ziczac-prematch-persistence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Check snapshot script
        run: python -m py_compile capture_prematch.py team_news.py engine.py rescore_predictions.py forecast_model.py revision_jobs.py revision_store.py double_revisions.py prospective_ensemble.py prospective_comparison.py prospective_double_comparison.py five_model_consensus.py five_model_comparison.py double_score_selection.py league_opponent_model.py smart_double_ai.py prospective_smart_double.py
      - name: Capture verified pre-kickoff snapshots
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python capture_prematch.py
      - name: Persist evidence and verify completed matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python persist_prematch.py
      - name: Compare frozen prospective challenger against verified results
        run: python prospective_comparison.py
      - name: Freeze five-double combinations and compare verified prospective results
        run: python prospective_double_comparison.py
      - name: Freeze Smart Double auto selections and verify outcomes
        run: python prospective_smart_double.py
      - name: Compare frozen five-model consensus with baseline
        run: python five_model_comparison.py
      - name: Re-score all saved singles and five doubles with retrospective comparisons
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python update_saved_forecasts.py
      - name: Commit permanent research history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prematch/
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve pre-match evidence and verified results [skip ci]"
            git push
          else
            echo "No new research history to commit"
          fi
      - name: Archive immutable snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziczac-prematch-snapshots
          path: |
            prematch_snapshots/*.json
            data/prematch/accuracy_report.json
            data/prematch/prospective_comparison.json
            data/prematch/prospective_double_comparison.json
            data/prematch/five_model_comparison.json
            data/prematch/smart_double_comparison.json
            data/prematch/smart_double_pairs/*.json
            data/prematch/double_pairs/*.json
            data/prematch/rescores/latest_report.json
            data/prematch/double_rescores/latest_report.json
          if-no-files-found: warn
          retention-days: 90

