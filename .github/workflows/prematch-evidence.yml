name: Capture verified pre-match evidence

on:
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: ziczac-prematch-persistence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3' 'psycopg[binary]>=3.2,<4'
      - name: Decide whether the six-hour legacy refresh is due
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          path=Path('data/prospective_ledger/cadence.json')
          now=datetime.now(timezone.utc)
          try:
              last=datetime.fromisoformat(json.loads(path.read_text())['last_heavy_at_utc'])
          except (OSError,ValueError,KeyError,TypeError):
              last=now-timedelta(days=1)
          heavy=os.environ['EVENT_NAME']!='schedule' or now-last>=timedelta(hours=6)
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write('heavy='+str(heavy).lower()+'\n')
          PYCODE
      - name: Check snapshot script
        run: python -m py_compile capture_prematch.py team_news.py engine.py rescore_predictions.py forecast_model.py revision_jobs.py revision_store.py double_revisions.py prospective_ensemble.py prospective_comparison.py prospective_double_comparison.py five_model_consensus.py five_model_comparison.py double_score_selection.py league_opponent_model.py smart_double_ai.py prospective_smart_double.py v10_prospective.py v10_evaluate.py automatic_doubles_ui.py smart_double_v8.py v10_settlement.py llm_research_panel.py sportmonks_probability_research.py sportmonks_probability_ui.py llm_research_ui.py multi_market_v10.py verified_features_v10.py reconcile_capture_conflicts.py
      - name: Independently verify recently completed exact-score and five-double fixtures
        # Scheduled passes can settle newly completed matches without waiting
        # for the six-hour heavy refresh. Cooldowns in v10_settlement.py cap
        # repeated requests; source-code pushes make no paid result calls.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          V10_RESULT_LIMIT: ${{ steps.cadence.outputs.heavy == 'true' && '20' || '2' }}
        run: python v10_settlement.py
      - name: Capture verified pre-kickoff snapshots
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          V10_BACKFILL_LIMIT: ${{ steps.cadence.outputs.heavy == 'true' && '12' || '0' }}
          V10_MARKET_REFRESH_LIMIT: ${{ steps.cadence.outputs.heavy == 'true' && '8' || '0' }}
        run: python capture_prematch.py
      - name: Persist newly captured originals
        run: python persist_prematch.py --snapshots-only
      - name: Persist evidence and verify completed matches
        if: steps.cadence.outputs.heavy == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python persist_prematch.py
      - name: Compare frozen prospective challenger against verified results
        if: steps.cadence.outputs.heavy == 'true'
        run: python prospective_comparison.py
      - name: Freeze five-double combinations and compare verified prospective results
        if: steps.cadence.outputs.heavy == 'true'
        run: python prospective_double_comparison.py
      - name: Freeze Smart Double auto selections and verify outcomes
        if: steps.cadence.outputs.heavy == 'true'
        run: python prospective_smart_double.py
      - name: Compare frozen five-model consensus with baseline
        if: steps.cadence.outputs.heavy == 'true'
        run: python five_model_comparison.py
      - name: Re-score all saved singles and five doubles with retrospective comparisons
        if: steps.cadence.outputs.heavy == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python update_saved_forecasts.py
      - name: Grade genuinely paired forecasts and simple baselines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python evaluate_prospective_ledger.py
      - name: Optional independent ten-AI research panel (shadow only)
        # Never make paid model calls merely because source code was pushed.
        if: steps.cadence.outputs.heavy == 'true' && github.event_name != 'push'
        env:
          LLM_RESEARCH_ENABLED: ${{ vars.LLM_RESEARCH_ENABLED }}
          LLM_RESEARCH_MAX_MATCHES: ${{ vars.LLM_RESEARCH_MAX_MATCHES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          PERPLEXITY_MODEL: ${{ vars.PERPLEXITY_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_API_URL: ${{ vars.QWEN_API_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL }}
        run: python llm_research_panel.py
      - name: Optional independent Sportmonks correct-score probabilities
        # Also prevent extra paid sports-data calls from source-code pushes.
        if: steps.cadence.outputs.heavy == 'true' && github.event_name != 'push'
        env:
          SPORTMONKS_PREDICTIONS_ENABLED: ${{ vars.SPORTMONKS_PREDICTIONS_ENABLED }}
          THIRD_FOOTBALL_API_KEY: ${{ secrets.THIRD_FOOTBALL_API_KEY }}
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: python sportmonks_probability_research.py
      - name: Freeze verified two-match multi-AI double challengers (no extra API calls)
        if: steps.cadence.outputs.heavy == 'true'
        run: python research_double_v15.py
      - name: Freeze v10 research doubles and grade independent prospective forecasts
        if: always()
        run: python v10_evaluate.py
      - name: Freeze and verify V25 professional analyst robustness challengers
        # Uses original source-stamped V8 score matrices only; all variants
        # are sensitivity checks and have no new provider/AI API requests.
        # New paired picks are write-once; result status is verified separately.
        if: always()
        run: python professional_analyst_shadow_v25.py
      - name: Freeze and verify V17 evidence-gated high-confidence outcomes
        # Research-only: no paid APIs and no rewrite of original V8 or exact doubles.
        if: always()
        run: python v17_confidence.py
      - name: Audit genuine source-matched model calibration (no network requests)
        # Original V8 + verified results only. Never refits production models.
        if: always()
        run: python v18_accuracy_audit.py
      - name: Freeze and grade V19 original-pair market challenger without new API calls
        # Only independently stored V9/V10 market source metadata, and only
        # when BOTH original V8 pair legs qualify before their kickoffs.
        if: always()
        run: python v19_match_intelligence.py
      - name: V24 broad market-date discovery and verified V8 binding
        # Owner-enabled via existing V23_EARLY_ODDS_ENABLED variable.
        # Maximum 2 paginated requests per run and 12 per UTC day by
        # default across this collector; no paid calls on source-code pushes.
        if: github.event_name != 'push' && vars.V23_EARLY_ODDS_ENABLED == 'true'
        env:
          V23_EARLY_ODDS_ENABLED: "true"
          V24_DAILY_ODDS_REQUESTS: ${{ vars.V24_DAILY_ODDS_REQUESTS }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v24_bulk_market_capture.py
      - name: Optional V23 earlier time-checked bookmaker market snapshots
        # One source request per eligible leg if owner opted in; no auto-spend.
        if: github.event_name != 'push' && vars.V23_EARLY_ODDS_ENABLED == 'true'
        env:
          V23_EARLY_ODDS_ENABLED: "true"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v23_early_odds.py
      - name: Optional V21 pre-match xG, lineup, injury and market source capture
        # Near-kickoff (8–35m) per-leg capture; requests consume API quota. Opt-in only.
        if: github.event_name != 'push' && vars.V21_EVIDENCE_ENABLED == 'true'
        env:
          V21_EVIDENCE_ENABLED: "true"
          V22_DEEP_XG_ENABLED: ${{ vars.V22_DEEP_XG_ENABLED }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v21_capture_sources.py
      - name: Freeze and score V21 same-day three-model pair tournament
        # Zero extra provider calls; immutable, never promoted automatically.
        if: always()
        run: python v21_prospective.py
      - name: Freeze and verify V22 xG + time-checked market five doubles (no API calls)
        if: always()
        run: python v22_prospective.py
      - name: Freeze and evaluate V23 market-and-goal-form five doubles
        # Uses only captured, source-verified odds and frozen existing V8 grids.
        # No additional external API calls; records never overwrite prior picks.
        if: always()
        run: python v23_prospective.py
      - name: Audit V22 source coverage, AI performance and chronological calibration
        if: always()
        run: python v22_quality_report.py
      - name: Diagnose original five-double misses and target feasibility (no API calls)
        if: always()
        run: python five_double_accuracy.py
      - name: Produce unified immutable hit/miss/pending evidence report
        # Run even after a provider quota failure; no new external requests.
        # The published GitHub status contains ONLY already-public scheduled
        # predictions. Private website selections remain in PostgreSQL.
        if: always()
        run: python ziczac_unified_audit.py
      - name: Audit genuine AI votes for both frozen matches (no API calls)
        if: always()
        run: python v15_real_source_audit.py --output data/v15_ai_double/source_audit.json
      - name: Mark the completed six-hour refresh
        if: success() && steps.cadence.outputs.heavy == 'true'
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          path=Path('data/prospective_ledger/cadence.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps({'last_heavy_at_utc':datetime.now(timezone.utc).isoformat()})+'\n')
          PYCODE
      - name: Commit permanent research history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/prospective_ledger data/daily_picks data/v10_prospective data/llm_research data/independent_football data/tracking data/v15_ai_double data/v17_confidence data/v18_accuracy data/v19_intelligence data/v21_sources data/v21_prospective data/v22_prospective data/v23_prospective data/v24_market_catalog data/accuracy_diagnosis data/pro_analyst_shadow
          git add data/prematch/ data/prospective_ledger/ data/daily_picks/ data/v10_prospective/ data/llm_research/ data/independent_football/ data/tracking/ data/v15_ai_double/ data/v17_confidence/ data/v18_accuracy/ data/v19_intelligence/ data/v21_sources/ data/v21_prospective/ data/v22_prospective/ data/v23_prospective/ data/v24_market_catalog/ data/accuracy_diagnosis/ data/pro_analyst_shadow/
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve pre-match evidence and verified results [skip ci]"
            # Source edits or another data run can land during capture.
            # Conflicting generated reports choose the newer upstream copy;
            # verified results are unioned only on matching source identity.
            # Immutable captures NEVER accept silent overwrites.
            for attempt in 1 2 3 4; do
              git fetch origin main
              if ! git rebase origin/main; then
                if ! python reconcile_capture_conflicts.py; then
                  git rebase --abort || true
                  echo "An immutable conflict needs review. All originals remain unchanged."
                  exit 1
                fi
                if git diff --cached --quiet; then
                  git rebase --skip
                else
                  GIT_EDITOR=true git -c core.editor=true rebase --continue
                fi
              fi
              if git push origin HEAD:main; then
                echo "Permanent research history committed successfully."
                exit 0
              fi
              echo "Another GitHub commit landed. Retrying safely ($attempt/4)"
              sleep 3
            done
            echo "Failed to safely publish historical evidence after four attempts."
            exit 1
          else
            echo "No new research history to commit"
          fi
      - name: Archive immutable snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziczac-prematch-snapshots
          path: |
            prematch_snapshots/*.json
            data/prematch/accuracy_report.json
            data/prematch/prospective_comparison.json
            data/prematch/prospective_double_comparison.json
            data/prematch/five_model_comparison.json
            data/prematch/smart_double_comparison.json
            data/prematch/smart_double_pairs/*.json
            data/prematch/double_pairs/*.json
            data/prematch/rescores/latest_report.json
            data/prospective_ledger/
            data/daily_picks/
            data/v10_prospective/
            data/tracking/status.json
            data/llm_research/status.json
            data/llm_research/evaluation.json
            data/llm_research/forecasts/*.json
            data/v15_ai_double/
            data/v17_confidence/
            data/v18_accuracy/
            data/v19_intelligence/
            data/v21_sources/
            data/v21_prospective/
            data/v22_prospective/
            data/v23_prospective/
            data/v24_market_catalog/
            data/accuracy_diagnosis/
            data/pro_analyst_shadow/
            data/independent_football/status.json
            data/independent_football/evaluation.json
            data/independent_football/forecasts/*.json
            data/prematch/double_rescores/latest_report.json
          if-no-files-found: warn
          retention-days: 90

