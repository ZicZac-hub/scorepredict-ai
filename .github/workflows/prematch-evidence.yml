name: Capture verified pre-match evidence

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ziczac-prematch-persistence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Check snapshot script
        run: python -m py_compile capture_prematch.py team_news.py engine.py rescore_predictions.py
      - name: Capture verified pre-kickoff snapshots
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python capture_prematch.py
      - name: Persist evidence and verify completed matches
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python persist_prematch.py
      - name: Re-score existing upcoming predictions using current live model
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python rescore_predictions.py
      - name: Commit permanent research history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prematch/
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve pre-match evidence and verified results [skip ci]"
            git push
          else
            echo "No new research history to commit"
          fi
      - name: Archive immutable snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziczac-prematch-snapshots
          path: |
            prematch_snapshots/*.json
            data/prematch/accuracy_report.json
            data/prematch/rescores/latest_report.json
          if-no-files-found: warn
          retention-days: 90
