name: V44 V37 batched result settlement regression
on:
  pull_request:
    paths:
      - 'backfill_verified_results.py'
      - 'tests/test_v44_v37_batched_backfill.py'
      - '.github/workflows/v44-v37-batched-backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_v44_v37_batched_backfill.py tests/test_v31_slate_settlement.py tests/test_v37_independent_settlement.py
