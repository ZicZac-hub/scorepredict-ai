name: Independent ZicZac all-methods accuracy tournament

on:
  workflow_dispatch:
  push:
    paths:
      - 'all_methods_tournament.py'
      - '.github/workflows/all-methods-tournament.yml'

permissions:
  contents: read

jobs:
  historical-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Check accuracy tournament syntax
        run: python -m py_compile all_methods_tournament.py
      - name: Download authentic 2025-2026 completed fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python fetch_backtest_history.py \
            --leagues PL,PD,BL1,SA,FL1 \
            --seasons 2025,2026 --max-matches 3500 \
            --output work/verified_matches.json
      - name: Run independent same-evidence score and double tournament
        run: |
          python -u all_methods_tournament.py work/verified_matches.json \
            --year 2026 --max-fixtures 220 --max-pair-days 24 \
            --output work/all_methods_tournament.json
      - name: Upload results and source-data provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-methods-accuracy-tournament
          if-no-files-found: warn
          path: |
            work/all_methods_tournament.json
            work/verified_matches.json
