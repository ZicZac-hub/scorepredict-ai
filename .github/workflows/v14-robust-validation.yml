name: V14 robust exact-five independent historical research

on:
  workflow_dispatch:
  push:
    paths:
      - 'robust_double_v14.py'
      - 'hybrid_five_v13.py'
      - 'v14_robust_backtest.py'
      - 'tests/test_robust_double_v14.py'
      - '.github/workflows/v14-robust-validation.yml'

permissions:
  contents: read

jobs:
  five-double-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified-model dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - name: Compile and test five-double research code
        run: |
          python -m py_compile robust_double_v14.py hybrid_five_v13.py hybrid_v13_ui.py v14_robust_backtest.py
          python -m pytest -q tests/test_robust_double_v14.py tests/test_hybrid_five_v13.py
      - name: Fetch authentic historical final-score evidence
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -u fetch_backtest_history.py \
            --leagues PL,PD,BL1,SA,FL1 --seasons 2025,2026 \
            --max-matches 3500 --output work/v14_verified_matches.json
      - name: Compare V14 against V8 and V7 on unmodified historical snapshots
        run: |
          python -u v14_robust_backtest.py work/v14_verified_matches.json \
            --year 2026 --max-fixtures 1300 --max-pair-days 160 \
            --min-robust-envelope 0.04 \
            --output work/v14_robust_backtest.json
      - name: Archive reproducible comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14-five-double-robust-historical-validation
          if-no-files-found: warn
          path: |
            work/v14_robust_backtest.json
            work/v14_verified_matches.json
