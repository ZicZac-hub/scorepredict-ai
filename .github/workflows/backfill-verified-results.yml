name: Backfill independently verified final scores
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: provider-result-backfill
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch strictly matched finished fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python backfill_verified_results.py
      - name: Validate V31 complete frozen-slate settlement coverage and provider quota
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("data/diagnostics/result_backfill.json").read_text())
          if s.get("state") == "missing_provider_key":
              print("V31 provider key not configured; no verified results were collected")
          else:
              audit=s.get("original_slate_settlement")
              assert isinstance(audit,dict), "V31 original frozen-slate enrollment audit missing"
              assert not audit["new_five_score_predictions_issued"]
              assert not audit["original_forecasts_modified"]
              assert s.get("requests",0)<=12
              assert (
                  audit["due_frozen_ids_prioritized"]+
                  audit["due_frozen_ids_deferred_by_budget"]==
                  audit["original_fixtures_due_without_saved_result"]
              ), "V31 due-original fixture accounting does not balance"
              print("V31 independent frozen-slate result collection:",audit)
          PY
      - name: Recompute matched original and prospective evaluations
        run: |
          python evaluate_prospective_ledger.py --files-only
      - name: Rebuild verified model benchmark automatically
        run: |
          python -m unittest -q test_benchmark_archive_loader.py
          python benchmark_archive_loader.py --report data/benchmark/summary.json
      - name: Recalculate source-verified 3-0 and scoreline calibration (no provider calls)
        run: |
          python scoreline_calibration_audit.py --output data/accuracy_diagnosis/scoreline_calibration.json
      - name: Recalculate matched prospective V8 versus V25 without hindsight
        run: |
          python v8_v25_matched_audit.py --output data/accuracy_diagnosis/v8_v25_matched.json
      - name: Check prospective V25 probability freeze integrity
        run: python v25_prospective_monitor.py --require-provenance
      - name: Recalculate V25 five-score feasibility against verified originals
        run: python v25_five_double_frontier.py
      - name: Score V26 frozen same-pair challenger without issuing new predictions
        run: python v26_temporal_score.py --verify-only
      - name: Independently verify V27 candidate rankings and settled day-level pairs
        run: python v27_pair_selection.py --verify-only
      - name: Verify V28 independent quality versus robustness paired trials
        # Read-only: never issue a new prediction during result settlement.
        run: python v28_independent_pair_trial.py --verify-only
      - name: Grade strictly forward-frozen V25 anchored same-pair probabilities
        run: python v25_anchored_challenger.py --verify-only
      - name: Independently verify V28 result-readiness and V29 distinct-pair studies
        # Audit saved future predictions ONLY, and label unverified games pending.
        run: python v29_pair_sensitivity.py --verify-only
      - name: Independently grade all pre-frozen candidate pairs on completed slates
        run: python v30_full_slate_audit.py
      - name: Compare original top versus bottom ranks on fully verified days only
        run: python v32_rank_discrimination.py
      - name: Grade pre-frozen top-bottom checkpoints as soon as their legs settle
        run: python v33_early_rank_checkpoints.py
      - name: V34 diagnose originally frozen score-selection failures and unique fixtures
        run: python v34_score_error_research.py
      - name: Grade V35 new score challengers using independently verified finals
        run: python v35_continuous_double_trials.py --verify-only
      # V34/V35 statuses are generated by the dedicated 15-minute bot and
      # prematch capture. Backfill still independently recomputes these audits
      # above, but must not stage them: concurrent bot runs may write a newer
      # report before a git pull --rebase, causing a deterministic merge conflict.
      # Original immutable forecasts and identity-verified results are untouched.
      - name: Commit newly verified scores and sanitized diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prematch/verified_results.json data/diagnostics/result_backfill.json data/prospective_ledger/comparison.json data/benchmark/summary.json data/accuracy_diagnosis/scoreline_calibration.json data/accuracy_diagnosis/v8_v25_matched.json data/accuracy_diagnosis/v25_freeze_monitor.json data/accuracy_diagnosis/v25_five_double_frontier.json data/v26_temporal_calibration/ data/v27_pair_selection/ data/v28_independent_pair_trial/ data/v25_anchored_challenger/ data/v29_pair_sensitivity/ data/v30_full_slate_ranking/ data/v32_rank_discrimination/ data/v33_early_rank_checkpoints/
          git diff --cached --quiet && exit 0
          git commit -m "chore: backfill identity-verified final results"
          # Other research steps update reports we intentionally did not stage.
          # Preserve those files without blocking a clean commit rebase.
          git pull --rebase --autostash origin main
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "SAFE STOP: unstaged research report conflicts require review"
            exit 1
          fi
          git push origin HEAD:main
