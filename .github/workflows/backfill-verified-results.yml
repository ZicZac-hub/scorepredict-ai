name: Backfill independently verified final scores
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: provider-result-backfill
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch strictly matched finished fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python backfill_verified_results.py
      - name: Recompute matched original and prospective evaluations
        run: |
          python evaluate_prospective_ledger.py --files-only
      - name: Commit newly verified scores and sanitized diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prematch/verified_results.json data/diagnostics/result_backfill.json data/prospective_ledger/comparison.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: backfill identity-verified final results"
          git pull --rebase
          git push
