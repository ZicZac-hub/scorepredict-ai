name: Verified backfill publication isolation
on:
  pull_request:
    paths:
      - 'scripts/publish_verified_backfill.sh'
      - 'tests/test_verified_backfill_publication.py'
      - '.github/workflows/backfill-verified-results.yml'
      - '.github/workflows/test-verified-backfill-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: bash -n scripts/publish_verified_backfill.sh
      - run: python -m pytest -q tests/test_verified_backfill_publication.py
