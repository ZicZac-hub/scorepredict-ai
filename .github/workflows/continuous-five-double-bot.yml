name: 24/7 Five-Double Research Bot

on:
  workflow_dispatch:
    inputs:
      retry_openai_after_key_rotation:
        description: 'One extra OpenAI API attempt after updating a failed 401 secret'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'continuous_accuracy_bot.py'
      - 'v35_continuous_double_trials.py'
      - 'v36_tail_calibration_research.py'
      - 'v36_prospective_double_trials.py'
      - 'v38_margin_calibration.py'
      - 'v38_prospective_double_trials.py'
      - 'v37_sparse_evaluation.py'
      - 'v37_sparse_history_research.py'
      - 'v28_independent_pair_trial.py'
      - 'continuous_bot_ui.py'
      - '.github/workflows/continuous-five-double-bot.yml'
  schedule:
    # Four independent checks each hour, across every day and time zone.
    # GitHub schedules may be delayed and are not an always-on server.
    - cron: '9,24,39,54 * * * *'

permissions:
  contents: write

concurrency:
  group: ziczac-five-double-research-bot
  cancel-in-progress: false

jobs:
  validate-and-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      AI_RESEARCH_BOT_ENABLED: ${{ vars.AI_RESEARCH_BOT_ENABLED }}
      AI_RESEARCH_MODEL: ${{ vars.AI_RESEARCH_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded numerical/test dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10' 'scipy>=1.11,<2'
      - name: Test the bot and candidate score methods without provider or AI calls
        run: python -m pytest -q tests/test_continuous_accuracy_bot.py tests/test_v36_tail_calibration_research.py tests/test_v36_prospective_double_trials.py tests/test_v38_prospective_double_trials.py tests/test_v28_workflow_handoff.py tests/test_v28_upstream_reporting.py tests/test_v8_source_health.py tests/test_v37_sparse_history_research.py tests/test_v37_quarter_hour_verification.py
      - name: Freeze new V28 originals and independently verify issued decisions
        # Critical producer stage for V35/V36: create a write-once V28
        # decision before either challenger checks its 20-minute issue window.
        # Reads only already persisted original V8 forecast receipts.
        # Never backfills old matches, calls providers, or changes live picks.
        run: python v28_independent_pair_trial.py
      - name: Recheck original V34 frozen score failures and source integrity
        run: python v34_score_error_research.py
      - name: Verify and only prospectively freeze NEW V35 methods
        # No new external football data request. Reverify the immutable V28
        # catalog against original receipts and record all six methods.
        run: python v35_continuous_double_trials.py
      - name: Freeze only future eligible V36 five-double methods and independently verify
        # Same original V28 pair, no historical issue or external data calls.
        run: python v36_prospective_double_trials.py
      - name: Freeze and verify V38 conditional winning-margin research
        run: python v38_prospective_double_trials.py
      - name: Independently grade saved V37 sparse UEFA forecasts without new provider calls
        # Source forecasts were issued and write-once frozen separately by
        # the main prematch collector; this job only compares ORIGINAL V37
        # frozen grids against independently verified regulation finals.
        # Run every 15 minutes even when the longer collector times out.
        run: python v37_sparse_evaluation.py
      - name: Generate watchdog report and optional bounded OpenAI research memo
        # A manual owner dispatch can request one extra attempt ONLY for a
        # saved API 401 after key rotation, and never for a 429.
        # AI cannot mutate forecasts, push code, execute shell or merge PRs.
        env:
          OWNER_OPENAI_RETRY: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_openai_after_key_rotation && 'true' || 'false' }}
        run: |
          if [ "$OWNER_OPENAI_RETRY" = "true" ]; then
            python continuous_accuracy_bot.py --retry-after-key-rotation
          else
            python continuous_accuracy_bot.py
          fi
      - name: Assert no retroactive model promotion and segregated denominators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('data/autobot/status.json').read_text())
          o=json.loads(Path('data/v28_independent_pair_trial/status.json').read_text())
          v=json.loads(Path('data/v35_continuous_challengers/status.json').read_text())
          w=json.loads(Path('data/v36_prospective_challengers/status.json').read_text())
          z=json.loads(Path('data/v37_sparse_prospective/status.json').read_text())
          m=json.loads(Path('data/v38_prospective_challengers/status.json').read_text())
          assert m['same_pair_comparisons_only'] and m['no_live_model_change']
          assert m['no_hindsight_ticket_reselection'] and m['not_validated_at_seventy_percent']
          assert not m['invalid_or_tampered_v38_sets_excluded']
          assert b['priority']=='five_exact_score_doubles'
          assert not o['forecast_production_model_modified']
          assert not o['original_v8_v25_v26_v27_forecasts_changed']
          assert o['no_additional_provider_or_llm_calls']
          assert not o['verified_comparison']['excluded_invalid_or_tampered_files']
          assert not b['production_model_changed_by_bot']
          assert b['no_claimed_70_percent_without_independent_evidence']
          assert v['research_only_methods_not_live_promoted']
          assert v['independent_same_fixture_comparisons_only']
          assert v['late_and_missing_results_remain_pending']
          # Preserve the safety stop, but identify the rejected immutable receipts.
          # Never silently discard these from the research denominator.
          assert not v['invalid_or_altered_v35_sets_excluded'], (
              'V35 invalid/altered frozen sets require investigation: '
              + repr(v['invalid_or_altered_v35_sets_excluded']))
          assert not v['original_v28_rejected_or_tampered']
          assert w['same_pair_comparisons_only']
          assert w['no_hindsight_ticket_reselection']
          assert w['no_live_model_change']
          assert w['not_validated_at_seventy_percent']
          assert z['not_a_five_double_trial']
          assert z['no_live_model_change']
          assert z['no_provider_calls']
          assert not z['ready_for_model_promotion']
          assert not z['invalid_or_tampered_excluded']
          assert z['frozen_unique_physical_fixtures'] == (
              z['verified_matched_physical_fixtures'] + z['pending'] +
              z['invalid_or_tampered_excluded'])
          assert not w['invalid_or_tampered_v36_sets_excluded']
          assert not w['original_v28_rejected_or_tampered']
          print('New genuine V28 decisions:',o['freeze']['created'])
          print('Verified V35 paired days:',v['verified_same_pair_days'])
          print('Research methods:',list(v['methods']))
          print('Verified independent V36 days:',w['verified_independent_sydney_days'])
          print('V37 saved physical fixtures:',z['frozen_unique_physical_fixtures'])
          print('Independently verified V37 finals:',z['verified_matched_physical_fixtures'])
          PY
      - name: Persist immutable new pre-match candidates and safe research reports
        # Never auto-change any production forecasting code. Only these
        # generated research paths may be written by this bot.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v38_prospective_challengers/ data/autobot/ data/v28_independent_pair_trial/ data/v35_continuous_challengers/ data/v36_prospective_challengers/ data/v37_sparse_prospective/status.json data/v34_score_error_research/status.json
          if git diff --cached --quiet; then
            echo 'No new bot research status'
            exit 0
          fi
          git commit -m "data: research bot verified scores and monitored methods [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve evidence even when status publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-double-bot-research
          path: |
            data/autobot/status.json
            data/autobot/openai_research_*.json
            data/autobot/openai_attempt_*.json
            data/autobot/openai_retry_*.json
            data/v28_independent_pair_trial/status.json
            data/v28_independent_pair_trial/decisions/*.json
            data/v34_score_error_research/status.json
            data/v35_continuous_challengers/status.json
            data/v38_prospective_challengers/status.json
            data/v38_prospective_challengers/sets/*.json
            data/v36_prospective_challengers/status.json
            data/v37_sparse_prospective/status.json
            data/v36_prospective_challengers/sets/*.json
            data/v35_continuous_challengers/sets/*.json
          if-no-files-found: warn
          retention-days: 30
